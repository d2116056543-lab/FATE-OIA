data_root: E:\sbw\BDD-OIA\data
raw_root: E:\sbw\BDD-OIA
bdd100k_root: E:\sbw\BDD100K
pretrained_weights: E:\sbw\SNNA_repro\SNNA\ckp\reference\dino_deitsmall8_pretrain.pth
eval_splits: test
best_selection_split: test
token_compression: none
feature_cache_enabled: false

experiment:
  name: acpr_meter_oia_v3_heca
  direct_image: true
  internal_test_selected: true
  publication_eligible: false
  no_metric_early_stop: true

data:
  data_root: E:\sbw\BDD-OIA\data
  raw_root: E:\sbw\BDD-OIA
  bdd100k_root: E:\sbw\BDD100K
  image_height: 360
  image_width: 640
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  mirror_probability: 0.25
  light_brightness_contrast: true
  strong_hue_jitter: false

splits:
  seed: 20260801
  audit_fraction: 0.08
  calib_fraction: 0.10
  main_audit_calib_disjoint: true

backbone:
  arch: vit_small
  patch_size: 8
  checkpoint_key: teacher
  pretrained_weights: E:\sbw\SNNA_repro\SNNA\ckp\reference\dino_deitsmall8_pretrain.pth
  selected_layers: [3, 7, 11]
  freeze_backbone: true
  no_grad_backbone: true

model:
  dim: 384
  action_dim: 4
  reason_dim: 21
  factor_rank: 16
  state_effect_rank: 64
  factor_text_prototype_path: artifacts/heca/factor_text_prototype.pt
  state_text_prototype_path: artifacts/heca/state_text_prototype.pt
  provenance_stats_path: artifacts/heca/factor_provenance_stats.json
  action_correction_fraction: 0.25
  pilot_action_correction_fraction: 0.20
  action_max_delta: 1.0
  action_max_rms_ratio: 0.20
  action_logit_norm_cap: 20.0
  # Calibrated to produce a measured 1--10% action-to-state gradient ratio
  # while preserving the zero-init visual action anchor.
  action_measurement_grad_scale: 0.20
  action_allocation_logit_scale: 4.0
  reason_global_delta_cap: 0.05
  use_hard_action_factor_mask: false
  use_admission_gate: false
  token_compression: none
  feature_cache_enabled: false
  use_action_set_final: false
  use_selector: false
  use_formal_meta: false

artifacts:
  offline_text_encoder_path: artifacts/heca/frozen_bert_base_uncased

training:
  from_scratch: true
  epochs: 14
  batch_size: 4
  gradient_accumulation_steps: 8
  effective_batch_size: 32
  shared_gradient_policy: next_window_single_backward
  gradient_ownership_probe_interval_updates: 200
  precision: bf16
  optimizer: AdamW
  scheduler: cosine_by_update
  weight_decay: 0.05
  grad_clip_global: 1.0
  foundation_grad_cap_min: 0.25
  foundation_grad_cap_max: 0.75
  warmup_ratio: 0.05
  credit_ramp_ratio: 0.15
  mirror_training_interval: 1
  foundation_initial: 0.00005
  foundation_target: 0.00010
  lr_shared_adapter: 0.00015
  lr_measurement: 0.00020
  lr_action_credit: 0.00020
  lr_reason_global: 0.00020
  lr_reason_correction: 0.00065

loss_weights:
  action_final: 1.00
  action_visual: 0.30
  action_credit_rank: 0.10
  action_necessity: 0.05
  action_specificity: 0.05
  action_nonreg: 0.15
  action_soft_f1: 0.06
  action_cardinality: 0.02
  action_logit_scale: 0.01
  action_nonreg_min_margin: 0.05
  action_nonreg_confidence_quantile: 0.75
  action_nonreg_boundary_margin: 0.05
  # Same-image target-effectiveness supervision for the action credit route.
  # It is active only for groundable, factor-supported near-boundary decisions.
  action_necessity_margin: 0.02
  action_necessity_relative_margin_fraction: 0.05
  action_necessity_min_margin: 0.002
  action_necessity_max_margin: 0.02
  action_necessity_visual_hard_margin: 0.25
  action_necessity_min_support: 0.10
  reason_final: 1.00
  reason_global: 0.50
  reason_rank: 0.08
  reason_soft_f1: 0.05
  reason_correction_sign: 0.14
  reason_correction_margin: 0.08
  reason_view_consistency: 0.05
  anchor: 0.05
  state: 0.08
  observability_null: 0.02
  discrimination: 0.03
  mirror: 0.02
  ontology_identity: 0.02

pu:
  start_after_epoch: 1
  min_positive_count: 20
  hidden_positive_fraction: 0.20
  min_auprc_lift: 0.02
  min_view_consistency: 0.50
  required_pass_streak: 2
  max_lambda: 0.10
  private_only: true

pilot:
  train_main: 4096
  train_audit: 1024
  train_calib: 512
  test: 512
  epochs: 4
  seed: 20260801
  from_scratch: true

runtime:
  test_only: true
  no_feature_cache: true
  require_no_token_compression: true
  foreground_only: true
  one_dino_call: true
  sequential_eval: false
  target_reserved_gb: 42.0
  hard_reserved_gb: 45.0

evaluation:
  cheap_diagnostics_each_epoch: [factor_off, state_uniform, reason_correction_off]
  patch_deletion_interval_epochs: 4
  patch_audit_max_unique: 128
  # Selected and geometry-matched control regions always delete the same area.
  patch_audit_patches_per_factor: 24
  patch_audit_factors_per_action: 2
