    positive_reason_anchors: []
    # A single-frame 2D box cannot identify physical proximity reliably.
    # Keep this risk proxy out of direct reason/action ownership.
    grounding_sources: [box2d]
    role: latent_proxy
    source_kind: proxy
    attribute_constraints: {proxy: front_box_risk}
    negative_policy: unknown_without_depth
