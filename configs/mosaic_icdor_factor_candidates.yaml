factors:
  - name: traffic_light_visible
    type: point
    num_prototypes: 3
    weak_regions: [upper_front]
    mirror_of: traffic_light_visible
    contradicts: []
    positive_reason_anchors: [3]
    grounding_sources: [box2d]
  - name: red_light_visible
    type: point
    num_prototypes: 3
    weak_regions: [upper_front]
    mirror_of: red_light_visible
    contradicts: [green_light_visible]
    positive_reason_anchors: []
    grounding_sources: [box2d, bdd100k_attributes]
    role: observable
    source_kind: grounded
    attribute_constraints: {trafficLightColor: red}
    negative_policy: reliable_if_attribute_complete
  - name: green_light_visible
    type: point
    num_prototypes: 3
