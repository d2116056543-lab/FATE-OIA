raw_root: E:\sbw\BDD-OIA
bdd100k_root: E:\sbw\BDD100K
pretrained_weights: E:\sbw\SNNA_repro\SNNA\ckp\reference\dino_deitsmall8_pretrain.pth
eval_splits: test
best_selection_split: test
token_compression: none
feature_cache_enabled: false

experiment:
  name: acpr_meter_oia_v2_tesa
  direct_image: true
  internal_test_selected: true
  publication_eligible: false
  no_metric_early_stop: true

data:
  data_root: E:\sbw\BDD-OIA\data
  raw_root: E:\sbw\BDD-OIA
  bdd100k_root: E:\sbw\BDD100K
  image_height: 360
  image_width: 640
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  mirror_probability: 0.25
  light_brightness_contrast: true
  strong_hue_jitter: false

splits:
  seed: 20260729
  audit_fraction: 0.08
  calib_fraction: 0.10
  main_audit_calib_disjoint: true

backbone:
  arch: vit_small
  patch_size: 8
  checkpoint_key: teacher
  pretrained_weights: E:\sbw\SNNA_repro\SNNA\ckp\reference\dino_deitsmall8_pretrain.pth
  selected_layers: [3, 7, 11]
  freeze_backbone: true
  no_grad_backbone: true

model:
  dim: 384
  action_dim: 4
  reason_dim: 21
  factor_rank: 16
  token_compression: none
  feature_cache_enabled: false
  use_action_set_final: false
  use_selector: false
  use_formal_meta: false
  action_correction_fraction: 0.20
  action_max_visual_rms: 5.0
  action_max_delta: 1.0
  action_logit_norm_cap: 20.0

training:
  epochs: 12
  batch_size: 6
  gradient_accumulation_steps: 5
  precision: bf16
  optimizer: AdamW
  scheduler: cosine
  weight_decay: 0.05
  grad_clip: 1.0
  foundation_grad_clip: 0.25
  warmup_ratio: 0.05
  mechanism_ramp_ratio: 0.10
  mirror_training_interval: 8
  lr_foundation: 0.00005
  lr_typed_factor: 0.00020
  lr_action_transport: 0.00020
  lr_reason_global: 0.00025
  lr_reason_correction: 0.00025

loss_weights:
  action_final: 1.00
  action_visual: 0.35
  action_correction: 0.20
  action_two_way: 0.05
  action_soft_f1: 0.03
  action_cardinality: 0.02
  action_specificity: 0.05
  action_identity: 0.03
  action_anti_monopoly: 0.05
  action_near_boundary: 0.03
  action_delta_ranking: 0.05
  reason_identity: 0.03
  reason_final: 1.00
  reason_global: 0.45
  reason_rank: 0.05
  reason_soft_f1: 0.05
  reason_evidence_correction: 0.03
  anchor: 0.10
  state: 0.10
  "null": 0.03
  observability: 0.03
  discrimination: 0.05
  mirror: 0.05
  dense_intervention: 0.05

meta:
  training_enabled: false
  audit_only: true

pu:
  initial_enabled: false
  min_positive_count: 20
  max_lambda: 0.15
  private_only: true

posthoc_calibration:
  enabled: true
  fit_split: train_calib
  updates_representation: false
  group_shrinkage: true
  per_label_if_needed: true

pilot:
  train_main: 4096
  train_audit: 1024
  train_calib: 512
  test: 512
  epochs: 2
  seed: 20260729

runtime:
  test_only: true
  no_feature_cache: true
  require_no_token_compression: true
  foreground_only: true
  one_dino_call: true
  sequential_eval: true
  target_reserved_gb: 42.0
  hard_reserved_gb: 45.0
