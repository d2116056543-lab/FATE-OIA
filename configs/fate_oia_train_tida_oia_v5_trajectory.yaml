experiment:
  name: tida_oia_trajectory_relational_credit_v5
  direct_video: true
  eval_splits: [test]
  best_selection_split: test
  best_selection_metric: deploy_joint
  internal_test_selected: true
  publication_eligible: false
data:
  manifest_path: artifacts/tida_clip_manifest.jsonl
  partition_seed: 20260821
  train_core_count: 2291
  train_calib_count: 312
  train_audit_count: 512
  test_count: 885
  target_height: 360
  target_width: 640
  context_height: 192
  context_width: 344
  history_frames: 14
  clip_seconds: 5.0
  num_workers: 6
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  batches:
    - {name: batch1, root: 'E:\sbw\FATE_Drive\bdd_oia_1000_train_test', clips: 'E:\sbw\FATE_Drive\bdd_oia_1000_train_test\clips'}
    - {name: batch2, root: 'E:\sbw\FATE_Drive\bdd_oia_linxxx3_batch2', clips: 'E:\sbw\FATE_Drive\bdd_oia_linxxx3_batch2\clips_prev5s'}
    - {name: batch3, root: 'F:\sbw\FATE_Drive\bdd_oia_linxxx3_batch3', clips: 'F:\sbw\FATE_Drive\bdd_oia_linxxx3_batch3\clips_prev5s'}
backbone:
  arch: vit_small
  patch_size: 8
  selected_layers: [3, 7, 11]
  pretrained_weights: ckp/reference/dino_deitsmall8_pretrain.pth
  freeze_backbone: true
  no_grad_backbone: true
  feature_cache_enabled: false
  token_compression: none
image_base:
  checkpoint: 'F:\FATE_Drive_runs\vetra_replay_from_scratch_v2_full_20260819_retry1\checkpoint_stage_b_continued.pth'
  config: configs/fate_oia_train_360x640_vetra_staged_from_scratch_v1.yaml
  action_scale: 1.0
  reason_scale: 0.60
model:
  dim: 384
  num_actions: 4
  num_reasons: 21
  num_predicates: 32
  context_chunk_size: 2
  temporal_layers: 2
  temporal_heads: 4
  temporal_dropout: 0.10
  action_kappa: 0.15
  action_evidence_trust_cap: 0.25
  reason_kappa: 0.12
  reason_evidence_trust_cap: 0.25
  conditional_temporal_utility: true
  transition_scales: [velocity, acceleration, region_velocity, persistence]
  action_temporal_budget_cap: 0.60
  reason_temporal_budget_cap: 0.50
  confidence_aware_reason_gate: true
  reason_gate_temperature: 0.50
  geometric_flow_enabled: false
  geometric_flow_hidden_dim: 64
  geometric_action_cap: 0.20
  geometric_reason_cap: 0.15
  geometric_flow_hw: [45, 80]
  traffic_action_enabled: false
  traffic_action_cap: 0.05
  traffic_motion_topk: 12
  traffic_trajectory_enabled: true
  traffic_trajectory_cap: 0.08
  traffic_trajectory_heads: 4
loss:
  terminal_hist: 0.25
  terminal_no_history: 0.0
  terminal_gain: 0.05
  temporal_order: 0.025
  repeated_last_contrast: 0.025
  flow_transition_align: 0.05
  action_asl: 1.00
  action_smooth_ap: 0.15
  action_base_protect: 0.10
  action_delta: 0.005
  action_route_sparse: 0.005
  action_flow_credit: 0.50
  action_flow_no_harm: 0.15
  action_utility_calibration: 0.05
  reason_partial: 1.00
  reason_rank: 0.08
  reason_soft_f1: 0.04
  reason_delta: 0.005
  reason_flow_credit: 0.30
  reason_flow_no_harm: 0.12
  reason_positive_no_harm: 0.25
  reason_utility_calibration: 0.04
  geometric_action_aux: 0.0
  geometric_action_rank: 0.0
  geometric_action_prefix: 0.0
  geometric_action_delta: 0.0
  traffic_action_aux: 0.0
  traffic_action_rank: 0.0
  traffic_action_delta: 0.0
  trajectory_action_boundary: 0.12
  trajectory_action_rank: 0.25
  trajectory_selected_control: 0.15
  trajectory_utility_calibration: 0.10
  trajectory_delta: 0.002
  geometric_reason_aux: 0.0
  geometric_reason_rank: 0.0
  geometric_reason_prefix: 0.0
  geometric_reason_delta: 0.0
training:
  seed: 20260823
  epochs: 10
  precision: bf16
  optimizer: AdamW
  weight_decay: 0.05
  global_grad_clip: 1.0
  warmup_ratio: 0.05
  temporal_ramp_end_ratio: 0.20
  flow_phases:
    foundation_end_ratio: 0.05
    credit_end_ratio: 0.20
    final_phase: SAFE_JOINT
  min_lr_ratio: 0.10
  ema_decay: 0.998
  no_metric_early_stop: true
  lr:
    history_reader: 0.0001
    temporal_encoder: 0.0001
    innovation_predictor: 0.0001
    predicate_differential: 0.0001
    flow_transition: 0.00015
    temporal_action: 0.0003
    temporal_reason: 0.00015
    geometric_action: 0.0005
    geometric_reason: 0.0003
    traffic_action: 0.00015
    traffic_trajectory: 0.0003
    traffic_trajectory_utility: 0.0005
memory_probe:
  max_reserved_gib: 45.0
  max_growth_gib: 0.25
  warmup_updates: 10
  measured_updates: 50
  candidates:
    - {name: A, batch_size: 4, gradient_accumulation_steps: 8, context_chunk_size: 2}
    - {name: B, batch_size: 3, gradient_accumulation_steps: 10, context_chunk_size: 3}
    - {name: C, batch_size: 2, gradient_accumulation_steps: 15, context_chunk_size: 5}
runtime:
  foreground_only: true
  no_feature_cache: true
  require_no_token_compression: true
  test_every_epoch: true
  save_every_epoch: true
  intervention_interval_updates: 4
  fixed_test_audit_samples: 128
  print_every_optimizer_updates: 100
  exact_resume: true
deployment:
  calibration_source: train_calib
  reason_beta_source: [train_calib, train_audit]
  reason_beta_candidates: [0.0, 0.25, 0.5, 0.75, 1.0]
  test_oracle_writeback: false
  stage_c_nested_oof: true
