experiment:
  name: vetra_strong_refine_rank_v2
  direct_image: true
  feature_cache_enabled: false
  token_compression: none
  eval_splits: [test]
  best_selection_split: test
data:
  data_root: 'E:\sbw\BDD-OIA\data'
  raw_root: 'E:\sbw\BDD-OIA'
  bdd100k_root: 'E:\sbw\BDD100K'
  image_height: 360
  image_width: 640
  patch_size: 8
  action_dim: 4
  reason_dim: 21
  split_seed: 20260806
  train_calib_fraction: 0.05
  train_audit_count: 128
  num_workers: 8
  prefetch_factor: 3
  pin_memory: true
  persistent_workers: true
backbone:
  selected_layers: [3, 7, 11]
  pretrained_weights: ckp/reference/dino_deitsmall8_pretrain.pth
primary:
  dim: 384
  action_dim: 4
  reason_dim: 21
  scene_predicates: configs/aie_scene_predicates.yaml
  reason_grammar: configs/acpr_reason_predicate_grammar.yaml
evidence:
  probes_per_action: 4
  local_points_per_layer: 8
  max_offset: 0.25
  predicate_bias_max: 0.25
  probe_chunk_size: 16
  action_kappa: 3.0
  action_scale: 1.0
reason_private:
  reason_kappa: 4.0
  reason_scale: 0.60
refiner:
  type: rank
  rank: 64
  max_delta: 0.08
  gain_candidates: [0.0, 0.25, 0.5, 0.75, 1.0]
training:
  epochs: 2
  batch_size: 6
  gradient_accumulation_steps: 5
  lr: 0.00003
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16
  action_logit_norm_cap: 20.0
  print_every_updates: 100
loss_weights:
  action_asl: 0.20
  action_pairwise_ap: 0.30
  action_smooth_ap: 1.00
  base_margin_trust: 1.00
  residual_energy: 0.50
loss:
  gamma_pos: 0.0
  gamma_neg: 4.0
  clip: 0.05
  pair_temperature: 0.25
  smooth_ap_temperature: 0.10
  trust_tolerance: 0.02
calibration:
  reason_probability_offset: 0.0
  grid_step: 0.005
runtime:
  cpu_threads: 6
