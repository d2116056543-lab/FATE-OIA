model:
  arch: vit_small
  patch_size: 8
  action_dim: 4
  reason_dim: 21
  relation_queries: 32
  max_edges_per_label: 8
  max_edges_total: 96
data:
  data_root: E:/sbw/BDD-OIA/data
  raw_root: E:/sbw/BDD-OIA
  bdd100k_root: E:/sbw/BDD100K
  image_height: 360
  image_width: 640
  preserve_aspect_ratio: true
training:
  epochs: 24
  batch_size: 4
  gradient_accumulation_steps: 8
  lr: 0.0003
  weight_decay: 0.05
  loss: asl
  relation_teacher_weight: 0.05
  base_aux_weight: 0.05
  eval_splits: test
  num_workers: 4
  log_every: 50
  pretrained_weights: ckp/reference/dino_deitsmall8_pretrain.pth
