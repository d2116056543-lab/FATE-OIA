experiment:
  # The strict loader preserves the formal name; run_manifest records pilot=true.
  name: acpr_mosaic_trust_v3_icdor
  direct_image: true
  initialization: public_dino_vits8_teacher_only
  eval_splits: [test]
  best_selection_split: test
  best_selection_metric: deploy_fixed_joint
  no_metric_early_stop: true

data:
  data_root: E:\sbw\BDD-OIA\data
  raw_root: E:\sbw\BDD-OIA
  bdd100k_root: E:\sbw\BDD100K
  image_height: 360
  image_width: 640
  patch_size: 8
  action_dim: 4
  reason_dim: 21
  train_core_fraction: 0.80
  train_audit_fraction: 0.10
  audit_visual_fraction: 0.05
  audit_target_fraction: 0.05
  train_calib_fraction: 0.10
  split_seed: 20260713
  num_workers_candidates: [4]
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

backbone:
  arch: vit_small
  patch_size: 8
  selected_layers: [3, 7, 11]
  pretrained_weights: E:\sbw\SNNA_repro\SNNA\ckp\reference\dino_deitsmall8_pretrain.pth
  checkpoint_key: teacher
  freeze_backbone: true
  no_grad_backbone: true
  feature_cache: false
  token_compression: none

model:
  formal_class: MOSAICTrustICDORModel
  dim: 384
  separate_visual_pyramids: true
  action_set_final: false
  decoder_layers: 2
  self_attention_heads: 4
  adapter:
    rank: 48
    activation: gelu
    rezero_init: 0.0
    rezero_max: 0.30
    depthwise_kernel: 3
    dropout: 0.05
  typed_attention:
    anchors_per_factor: 2
    heads: 4
    point_samples: 4
    curve_samples: 16
    region_samples: 12
  factor_measurement:
    spatial_prior_scale_init: 0.05
    spatial_prior_scale_max: 0.20
    spatial_prior_dropout: 0.50
    content_temperature_init: 0.07
  action_route:
    gate_init: 0.02
    gate_max: 0.05
    # CREDO-MAP learning access only; neither field is an admission threshold.
    action_shadow_credibility_floor: 0.05
    reason_semantic_credibility_floor: 0.15
    router_dustbin_init: -4.0
    shadow_until_edge_admission: true
  reason:
    escape_token_penalty: 0.01
    observed_mix_init: 0.05

credibility:
  independent_of_reason_labels: true
  bootstrap_replicates: 1000
  ema_decay: 0.90
  image_only_cap: 0.10
  unknown_cap: 0.0
  no_reliable_negative_cap: 0.25

fine_transport:
  enabled: true
  point_eta: 0.70
  curve_eta: 0.80
  region_eta: 0.60
  local_reread_offset_max: 0.08
  fine_off_diagnostic: true
  coarse_off_diagnostic: true

factor_certificate:
  config: configs/mosaic_icdor_certificate_rules.yaml
  freeze_after_build: true
  bootstrap_replicates: 1000

edge_admission:
  freeze_after_build: true
  audit_refresh_epochs: 2

selective_observation:
  pi_min: 0.20
  pi_max: 0.95
  false_positive_max: 0.05
  group_names: [traffic_control, obstacle, lane, other]
  synthetic_missing_positive_fraction: 0.20
  posterior_queue_size: 2048

loss:
  policy:
    action_visual: 1.00
    action_rank: 0.10
    action_shadow: 0.50
    reason_visual_observed: 1.00
    reason_observed_rank: 0.05
    reason_observation: 0.20
    reason_posterior_rank: 0.05
    factor_presence: 1.00
  action:
    gamma_pos: 0.0
    gamma_neg: 4.0
    clip: 0.05
    base_asl_weight: 1.00
    rank_weight: 0.10
    cardinality_weight: 0.02
  action_route:
    shadow_asl_weight: 0.50
    pareto_weight: 1.00
    sparsity_weight: 0.02
    dustbin_weight: 0.01
    intervention_weight: 0.10
  factor:
    # V5: each term is aligned to a separately exported factor audit.
    balanced_presence_weight: 1.00
    visibility_weight: 0.50
    geometry_weight: 0.15
    query_identity_weight: 0.10
    image_identity_weight: 0.10
    prior_gap_weight: 0.05
    matched_grounding_weight: 0.05
    view_weight: 0.03
    prototype_weight: 0.01
  reason:
    visual_observed_asl_weight: 1.00
    observed_asl_weight: 0.50
    latent_core_weight: 0.30
    latent_weak_negative_weight: 0.15
    observation_nll_weight: 0.20
    posterior_bce_weight: 0.00
    posterior_rank_weight: 0.00
    factor_latent_consistency_weight: 0.02
    escape_token_weight: 0.005
    propensity_regularization_weight: 0.00

optimizer:
  name: AdamW
  fused_when_supported: true
  weight_decay: 0.05
  scheduler: warmup_cosine
  warmup_epochs: 1
  min_lr_ratio: 0.05
  lr:
    factor_visual_pyramid: 1.0e-4
    action_visual_pyramid: 1.0e-4
    reason_visual_pyramid: 1.0e-4
    factor_adapter: 1.5e-4
    factor_extractor: 2.0e-4
    factor_prototypes: 1.0e-4
    action_adapter: 1.5e-4
    action_visual_decoder: 2.0e-4
    action_router_rereader: 2.0e-4
    reason_adapter: 1.5e-4
    reason_visual_decoder: 2.0e-4
    reason_latent_decoder: 2.0e-4
    reason_observed_mixer: 1.0e-4
    observation_model: 1.0e-4
    threshold_head: 5.0e-4
  owner_clip:
    factor_visual_pyramid: 0.5
    action_visual_pyramid: 1.0
    reason_visual_pyramid: 1.0
    factor_adapter: 0.5
    factor_extractor: 0.5
    factor_prototypes: 0.5
    action_adapter: 1.0
    action_router_rereader: 0.5
    reason_adapter: 1.0
    reason_latent_decoder: 0.5
    reason_observed_mixer: 0.5
    observation_model: 0.5
    threshold_head: 1.0

training:
  epochs: 12
  bf16: true
  tf32: true
  torch_compile: false
  no_metric_early_stop: true
  print_every: 200
  runtime_candidates:
    - {batch_size: 8, grad_accum: 4, effective_batch: 32}
  max_reserved_vram_gb: 43.5
  regime_schedule: [JOINT_SHADOW, ADMISSION_CONSOLIDATION]
  shadow_active_epoch: 0
  final_action_visual_until_admission: true
  no_hard_certificate_training_gate: true

calibration:
  enabled: true
  steps_per_epoch: 100
  batch_size: 256
  surrogate_temperature: 0.20
  soft_f1_weight: 1.00
  bce_weight: 0.05
  rate_weight: 0.02
  delta_weight: 0.01
  cardinality_weight: 0.02
  label_delta_max: 1.0
  groups: [actions, common_reasons, tail_reasons]
  tail_reason_indices: [12, 9, 5, 14, 6, 11, 10, 13]
  train_calib_only: true
  representation_frozen: true
  deploy_equation: raw_minus_theta
  test_oracle_diagnostic_only: true

evaluation:
  eval_splits: [test]
  eval_every_epoch: true
  best_selection_split: test
  best_selection_metric: deploy_fixed_joint
  threshold: 0.5
  report_raw: true
  report_deploy_fixed: true
  report_train_calib_teacher_diagnostic: true
  report_test_oracle_diagnostic: true

runtime:
  foreground_only: true
  no_feature_cache: true
  require_no_token_compression: true
  require_runtime_selection: true
  runtime_selection_path: .review/mosaic_v5_pilot_runtime_selection.json
  # Real DINO probe for diagnostic pilot only; never accepted by full training.
  warmup_profile_steps: 2
  timed_profile_steps: 4
  dataloader_stability_minutes: 15
  target_transfer_intervention_chunk_size: 4
  # Continuous sigmoid maps are converted to this many per-factor selected
  # evidence slots before same-image equal-mass control interventions.
  target_transfer_evidence_slots: 16
  # Epoch-zero online utility is bounded; bootstrap-quality target audit is every two epochs.
  online_target_probe_max_samples: 256
