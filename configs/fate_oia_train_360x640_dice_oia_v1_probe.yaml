  global_grad_clip: 1.0
  action_logit_norm_cap: 20.0
  print_every_optimizer_updates: 100
runtime:
  cpu_threads: 4
  test_only: true
  no_feature_cache: true
  require_no_token_compression: true
  max_reserved_memory_gb: 44.5
bootstrap:
  resamples: 2000
  seed: 20260810
