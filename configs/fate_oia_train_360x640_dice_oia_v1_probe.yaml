  dominant_probe_max_ratio: 0.90
reason:
  kappa: 4.0
reason_private:
  action_prior_max: 0.75
  predicate_prior_max: 0.75
  reason_kappa: 4.0
  reason_scale_start: 0.60
  reason_scale_max: 0.60
  reason_scale_ramp_ratio: 0.001
