data:
  observed_frames: 15
  target_offset: 1
  stride: 3
  frame_protocol: target_current_15
  eval_frame_protocol: target_current_15
  formal_input_uses_target_frame: true
  allow_target_frame_in_input: true
  action_names: [maintain_speed, reduce_speed, stop_car]
  action_dim: 3
  exp29_dim: 29
  use_action_soft_target: true
  use_paper_effective_weight: true
  all_zero_exp29_is_unknown: true
  exp_supervision_policy: record_mask
  eval_exp_supervision_policy: record_mask
  exp_near_keyframe_max_gap: 30
  strict_counts: false
  use_decision_group_weight: false
  protocol_index:

    enabled: false
    dir: .background_runs/psi_protocol_indices_20260702
    name: gap_le_60
    candidates: [gap_le_60, gap_le_90, gap_decay_180, joint_clean_gap60_expsemantic]
    note: >-
      Generated by the PSI protocol learnability audit. The formal default uses
      gap_le_60 because both CPU low-res RGB proxies and real frozen-DINO probes
      showed that this protocol is visually learnable while keeping the action
      label close to the decision keyframe. gap_decay_180 remains available only
      as a larger-but-noisier ablation.
  max_sample_strategy: balanced_action
  eval_max_sample_strategy: balanced_action
  max_sample_seed: 17
  balanced_action_sampler:
    enabled: true
    class_weights: [1.0, 1.0, 2.0]
    exp_aligned_boost: 1.0
  protocol_note: >-
    Verified PSI K-current protocol: gap<=30 segment-frame split with target-frame input. Action is supervised on dense, decision-close rows; Exp29 uses aligned-only sparse masks from the rebuilt package. Old expanded-row full-text supervision is forbidden because it caused action/Exp mismatch and poor test generalization.

  image_height: 320
  image_width: 576
  patch_size: 8
  direct_image_training: true
  feature_cache_enabled: false
  token_cache_enabled: false
  logit_cache_enabled: false

  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  non_blocking_transfer: true

model:
  state_dim: 384
  predicate_dim: 384
  motion_dim: 256

  visual_encoder:
    type: dino_anchor_plus_fast_motion
    anchor_frames: [0, 3, 6, 9, 12, 14]
    dino_input_height: 320
    dino_input_width: 576
    patch_size: 8
    optional_full15_dino_mode: true
    default_full15_dino_mode: false
    selected_layers: [3, 7, 11]
    dino_chunk_size: 6
    freeze_dino_backbone: true
    adapter_type: lora
    adapter_rank: 4
    last_layer_fusion: learned

  predicates:
    oia_base_count: 32
    psi_specific_count: 16
    total_count: 48
    assignment: entmax15
    region_priors: true
    temporal_module: gru_plus_tcn
    lagged_proxy_for_non_anchor_frames: true
    output_evidence_kind: true
    require_oia_transfer_source: true
    require_transformer_text: true

  nnpu:
    enabled: true
    rules_yaml: configs/acpr_interactflow_text_rules.yaml
    unknown_as_negative: false
    nonnegative_risk: true
    train_only_calibration: true
    per_predicate_prior: true
    per_predicate_threshold: true
    per_predicate_temperature: true

  interaction_flow:
    regimes: [clear_to_go, caution_required, yielding_required, stop_required]
    phases: [waiting, approaching, entering, crossing, leaving, uncertain]
    sources: [pedestrian_conflict, crosswalk_context, traffic_signal, front_vehicle_yielding, side_occlusion, intersection_constraint]
    corridors: [left_sidewalk_zone, center_ego_path, right_sidewalk_zone, crosswalk_zone]
    factor_set: regime_phase_source
    factor_count: 16
    assignment: entmax15
    grammar_yaml: configs/acpr_interactflow_state_grammar.yaml
    response_lags: [0, 1, 2, 3, 4]

  decision_ledger:
    exact_additive_decomposition: true
    benefit_gate: true
    non_degradation_margin: 0.01
    state_contributions_to_actions: true
    global_branch_independent_supervision: true

  exp29:
    enabled: true
    label_embedding_source: psi_exp29
    masked_unknown_loss: true
    train_calibration_init:
      enabled: true
      max_samples: 512
      min_pred_positive_rate: 0.02
      accept_mf1_tolerance: 0.005
      max_global_pred_rate: 0.35
      pi_min: 0.03
      pi_max: 0.35
      deploy_logit_margin: 0.12
    reliability_weighted: true
    contribution_alignment: true

loss:
  action_final_soft_kl: 1.00
  action_global_soft_kl: 0.40
  ledger_residual_soft_kl: 0.15
  non_degradation_soft_kl_hinge: 0.08
  benefit_gate_advantage_bce: 0.04

  predicate_pu: 0.08
  predicate_structural_weak: 0.03
  interaction_state_semantic: 0.04
  response_lag_consistency: 0.010
  response_lag_temporal_consistency: 0.020
  temporal_consistency: 0.020

  exp29_raw_asl: 0.12
  exp29_calibrated_asl: 0.25
  exp29_pu: 0.04
  exp29_soft_f1: 0.08
  exp29_positive_rate: 0.04
  exp29_cardinality: 0.02
  exp29_pairwise_rank: 0.04
  exp29_ledger_alignment_js: 0.06

  gate_prior_noncollapse: 0.004
  factor_sparsity: 0.001
  contribution_alignment_js: 0.0

  hard_action_ce_only: false
  contribution_magnitude_residual: false
  test_threshold_leakage: false

optimization:
  epochs: 30
  precision: bf16
  optimizer: adamw
  warmup_ratio: 0.05
  scheduler: cosine
  min_lr_ratio: 0.10
  gradient_clip_norm: 1.0
  metric_based_early_stop: false
  effective_batch_target: 64

  learning_rates:
    dino_adapter: 0.00001
    predicate_transfer: 0.00010
    dynamic_predicate: 0.00010
    motion_path: 0.00010
    interaction_flow: 0.00010
    response_lag: 0.000075
    decision_ledger: 0.00010
    exp29_head: 0.00010
    calibration_thresholds: 0.00005

  weight_decay:
    default: 0.01
    backbone: 0.05
    bias_norm_gate: 0.0

evaluation:
  after_every_epoch: true
  eval_splits: [test]
  validation_loader_forbidden_formal: true

  action_metrics:
    - Act_oAcc
    - Act_mAcc
    - Act_macro_F1
    - Act_weighted_F1
    - Maintain_recall
    - Reduce_recall
    - Stop_recall
    - Maintain_F1
    - Reduce_F1
    - Stop_F1
    - soft_target_KL
    - ECE

  exp29_metrics:
    - Exp_oF1
    - Exp_mF1
    - Exp_mAP
    - Exp_micro_F1
    - Exp_macro_F1
    - positive_mask_only_F1

  best_selector:
    primary: joint
    joint_formula: "0.60*Act_mAcc + 0.25*Stop_F1 + 0.15*Exp_mF1"
    tie_breakers: [Act_mAcc, Stop_F1, Exp_mF1, negative_soft_target_KL]

  save_best: [action, exp, joint, test]

traffic_influence:
  lightweight_audit_samples: 256
  every_epoch: true
  final_full_test: true
  interventions:
    - global_only
    - regime_off
    - phase_off
    - source_off
    - factor_off
    - predicate_off
    - evidence_tube_off
    - equal_mass_random
    - temporal_reverse
    - temporal_shuffle
    - lag_disabled
    - last_frame_only
    - prefix_5
    - prefix_10
    - prefix_15
  random_equal_mass_trials: 5
  bootstrap_trials: 1000
  permutation_trials: 1000

profile:
  candidates:
    - {batch_size: 8, gradient_accumulation_steps: 4}
    - {batch_size: 6, gradient_accumulation_steps: 5}
    - {batch_size: 4, gradient_accumulation_steps: 8}
    - {batch_size: 3, gradient_accumulation_steps: 11}
    - {batch_size: 2, gradient_accumulation_steps: 16}
  warmup_batches: 10
  measured_batches: 100
  preferred_peak_reserved_gib: [42.0, 45.0]
  hard_peak_reserved_limit_gib: 46.0
  max_projected_epoch_plus_eval_hours: 2.5
  max_data_time_fraction: 0.25
  selection_metric: samples_per_second
  dummy_allocation_forbidden: true

visualization:
  fixed_cases_per_epoch: 8
  best_checkpoint_cases: 256
  keyframes_per_case: 15
  canvas_png: true
  source_json: true
  atlas_html: true
  manual_boxes_forbidden: true
  fabricated_effects_forbidden: true

supervisor:
  foreground_only: true
  heartbeat_seconds: 60
  require_review_pass: true
  require_clean_worktree: true
  require_remote_sha_match: true
  metric_based_stop: false
  oom_fallback: true
  resume_latest: true
  reject_tmp_checkpoints: true
  user_stop_sentinel: control/STOP_REQUESTED_BY_USER

