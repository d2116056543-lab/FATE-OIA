data:
  data_root: E:/sbw/BDD-OIA
  raw_root: E:/sbw/BDD-OIA
  bdd_oia_root: E:/sbw/BDD-OIA
  bdd100k_root: E:/sbw/BDD100K
  image_height: 360
  image_width: 640
  patch_size: 8
  preserve_aspect_ratio: true
  feature_cache_enabled: false
  token_compression: none
  grounding_primary: false
  bdd100k_test_gt_input: false
model:
  arch: vit_small
  pretrained_weights: ckp/reference/dino_deitsmall8_pretrain.pth
  checkpoint_key: teacher
  n_last_blocks: 1
  backbone_frozen: true
  action_dim: 4
  reason_dim: 21
  scene_proto_count: 12
  implicit_proto_count: 12
  expert_layers_action: 2
  expert_layers_reason: 2
  expert_layers_tail: 1
  expert_heads: 4
  expert_dropout: 0.05
  pair_topk: 24
  pair_temperature: 0.7
  pair_group_count: 6
  action_residual_cap: 0.04
  reason_residual_cap: 0.12
  tail_reason_residual_cap: 0.18
  r2a_max_scale: 0.25
  a2r_max_scale: 0.75
training:
  epochs: 32
  batch_size: 4
  gradient_accumulation_steps: 8
  fallback_batch_size_1: 3
  fallback_gradient_accumulation_steps_1: 11
  fallback_batch_size_2: 2
  fallback_gradient_accumulation_steps_2: 16
  optimizer: adamw
  weight_decay: 0.05
  grad_clip: 1.0
  lr_base_fate: 0.0002
  lr_scene_state: 0.00025
  lr_experts: 0.0003
  lr_pair_attention: 0.00025
  lr_router: 0.0002
  lr_tail: 0.00025
  min_lr: 0.00001
  warmup_epochs: 2
  scheduler: cosine
  plateau_restore: true
  reduce_on_no_improve: true
  no_improve_patience_epochs: 4
  reduce_factor: 0.5
  gradient_budget_rho: 0.15
  aux_weight_cap: 0.30
  pcgrad_enabled: true
  asl_gamma_pos: 0.0
  asl_gamma_neg: 4.0
  asl_clip: 0.05
  num_workers: 4
  log_every: 200
readiness:
  min_pair_concentration: 0.08
  min_pair_reliability_std: 0.015
  min_reason_branch_mf1_for_r2a: 0.30
  final_action_drop_tolerance: 0.006
  disable_r2a_on_action_drop: true
evaluation:
  test_only_evaluation: true
  best_selection_split: test
  best_selection_metric: test_standard_joint
  threshold_mode: fixed
  fixed_threshold: 0.5
