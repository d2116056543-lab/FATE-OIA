  pilot_every_updates: 40
  full_every_updates: 100
  ema_old_weight: 0.90
  ema_new_weight: 0.10
  utility_lower: 0.001
  utility_upper: 0.005
  virtual_lr: 0.00010
  lambda_m: 1.0
  admission_mode: matched_null_lcb
  admission_audit_batches: 3
  admission_min_consecutive: 2
  admission_lcb_z: 1.645
  admission_z_scale: 3.0
  admission_eps: 0.000001
  admission_min_observations: 8
  admission_match_tolerance: 0.0001
  require_train_audit_only: true

pu:
  initial_enabled: false
  hidden_positive_fraction: 0.30
  min_positive_count: 20
  max_lambda: 0.15
  private_only: true

counterfactual:
  every_optimizer_updates: 8
  max_patches: 128
  minimum_patches: 4
  selected_mass: 0.60
  diagnostic_test_samples: 128
  test_diagnostic_no_grad: true

