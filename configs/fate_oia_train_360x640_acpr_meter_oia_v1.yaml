  lr_reason_local_private: 0.00025
  lr_reason_annotation: 0.00025
  lr_meta_adapters: 0.00010
  lr_pu_private: 0.00025
  warmup_fraction: 0.05
  ramp_fraction: 0.10

loss_weights:
  action_final: 1.00
  action_visual: 0.40
  action_semantic: 0.40
  action_two_way: 0.05
  action_soft_f1: 0.03
  action_cardinality: 0.02
  selector_regret: 0.10
  reason_final: 1.00
  reason_global: 0.40
  reason_local: 0.40
  reason_rank: 0.05
  reason_soft_f1: 0.05
  reason_annotation_delta: 0.02
  grounding_start: 0.02
  grounding_end: 0.10
  grounding_ramp_fraction: 0.05
  counterfactual_end: 0.03
  counterfactual_ramp_fraction: 0.10

meta:
