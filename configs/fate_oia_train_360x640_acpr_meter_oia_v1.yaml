  fit_split: train_calib
  updates_representation: false
  require_model_state_hash_unchanged: true
  fallback_on_deploy_degradation: true

runtime:
  test_only: true
  no_feature_cache: true
  require_no_token_compression: true
  foreground_only: true
  profile_candidates: [[16, 2], [12, 3], [8, 4], [6, 5]]
  profile_num_workers: [4, 8]
  profile_prefetch_factor: [2, 4]
  persistent_workers: true
  target_reserved_gb: 42.0
  hard_max_reserved_gb: 45.0
  print_every_optimizer_updates: 50
  eval_test_every_epoch: true

