  formal_path_forbidden_imports:
    - ACPROIAModel
    - ACPRLabelTrunk
    - ACPRScenePredicateHead
    - ACPRPredicateReasoner
    - ACPRPairMemory
    - ACPRActionComboAux
    - ACPRCalibrationHead
