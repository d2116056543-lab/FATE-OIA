experiment:
  name: acpr_rael_oia_v1
  direct_image: true
  test_only_evaluation: true
  best_selection_split: test
  best_selection_metric: deploy_fixed_joint
  internal_test_selected: true
  publication_eligible: false

governance:
  expected_base_commit: 373aa49feac17372574fd7fb056c1d79c7c848fe
  target_branch: acpr_rael_oia_v1_direct_image
  push_remote: github
  target_worktree: E:/sbw/FATE_Drive/fate_oia_acpr_rael_oia_v1_worktree
  source_worktree: E:/sbw/FATE_Drive/fate_oia_acpr_calalign_v1_2_worktree
  source_branch: acpr_calalign_v1_2
  canonical_records:
    - E:/sbw/FATE_Drive/task_plan.md
    - E:/sbw/FATE_Drive/findings.md
    - E:/sbw/FATE_Drive/progress.md
  canonical_records_read_before: [code, test, run, commit, push]
  code_only_git_history: true
  artifacts_not_committed:
    - .background_runs
    - checkpoint
    - logits
    - dataset
    - cache

constraints:
  feature_cache_enabled: false
  visual_feature_cache: false
  token_compression: none
  video_input: false
  external_vlm: false
  per_image_caption: false
  checkpoint_distillation: false
  run_c_checkpoint: false
  cached_logits: false
  scene_graph: false
  pmi_bias: false
  static_cooccurrence_bias: false
  action_set_final: false
  bdd100k_test_forward: false
  reason_logits_to_action: false
  reason_probabilities_to_action: false
  reason_labels_to_action: false
  reason_private_to_action: false
  pu_to_action: false
  text_to_action: false

